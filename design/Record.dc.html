<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Line — recording</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&amp;family=Caveat+Brush&amp;display=swap">
<style>
body{margin:0}
a{color:#E8D9C2}a:hover{color:#F6EFE4}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2A1E12; color: #F6EFE4; font-family: 'Source Serif 4', Georgia, serif;">

  <p style="position: absolute; left: 28px; top: 32px; margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 800; font-size: 15px; letter-spacing: 0.14em; color: #E8D9C2;">SAY WHAT'S ON YOUR MIND</p>

  <p style="position: absolute; left: 28px; right: 28px; top: 92px; margin: 0; font-family: 'Caveat Brush', cursive; font-size: 40px; line-height: 1.02; color: #F6EFE4; transform: rotate(-1.5deg); transform-origin: left center;">what's the in-between you're in right now?</p>
  <a href="#any" style="position: absolute; left: 28px; top: 238px; font-size: 15px;">or say anything</a>

  <span style="position: absolute; left: 217px; top: 388px; width: 60px; text-align: center; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 34px; color: #F6EFE4;">0:38</span>

  <svg aria-hidden="true" width="390" height="120" viewBox="0 0 390 120" style="position: absolute; left: 0; top: 440px;">
    <line x1="{{tipX}}" y1="60" x2="390" y2="60" stroke="#E8D9C2" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 6"></line>
    <path d="{{wave}}" fill="none" stroke="#F6EFE4" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="{{tipX}}" cy="60" r="16" fill="#F6EFE4" fill-opacity="0.12"></circle>
    <circle cx="{{tipX}}" cy="60" r="6" fill="#F6EFE4"></circle>
  </svg>
  <span style="position: absolute; right: 16px; top: 516px; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 700; font-size: 15px; color: #E8D9C2;">1:00</span>

  <p style="position: absolute; left: 28px; right: 40px; top: 580px; margin: 0; font-size: 17px; line-height: 1.4; font-style: italic; color: #E8D9C2;">Your voice draws the line. When it reaches the edge, you're done.</p>

  <div style="position: absolute; left: 0; right: 0; top: 686px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px;">
    <button type="button" style="min-width: 88px; height: 48px; border: 1.5px solid #E8D9C2; border-radius: 24px; background: transparent; color: #F6EFE4; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px;">Start over</button>
    <button type="button" aria-label="Stop recording" style="width: 96px; height: 96px; border-radius: 48px; border: 2px solid #F6EFE4; background: transparent; display: flex; align-items: center; justify-content: center;">
      <span style="display: block; width: 30px; height: 30px; border-radius: 4px; background: #F6EFE4;"></span>
    </button>
    <a href="Share.dc.html" style="min-width: 88px; height: 48px; box-sizing: border-box; border-radius: 24px; background: #F6EFE4; color: #2A1E12; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; font-weight: 600;">Done</a>
  </div>

  <p style="position: absolute; left: 0; right: 0; top: 804px; margin: 0; text-align: center; font-size: 13px; color: #E8D9C2;">Nothing leaves your phone until you choose to share it.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var tip = 247, pts = [];
    for (var x = 0; x <= tip; x += 3) {
      var i = x / 3;
      var env = 0.25 + 0.75 * Math.abs(Math.sin(i * 0.11 + 0.6)) * (0.55 + 0.45 * Math.abs(Math.sin(i * 0.031)));
      var osc = Math.sin(i * 1.7) * 0.62 + Math.sin(i * 0.53 + 1.1) * 0.38;
      var y = 60 + 44 * env * osc;
      if (x < 6) y = 60;
      pts.push((x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(1));
    }
    pts.push('L' + tip + ' 60');
    return { wave: pts.join(' '), tipX: tip };
  }
}
</script>
</body>
</html>
