<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Line — let it go, or share it (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&amp;family=Caveat+Brush&amp;display=swap">
<style>
body{margin:0}
a{color:#5A3814}a:hover{color:#2A1E12}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6EFE4; color: #2A1E12; font-family: 'Source Serif 4', Georgia, serif;">

  <div style="position: absolute; left: 64px; width: 560px; top: 48px; height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; border: 1.5px solid #2A1E12; border-radius: 30px; padding: 0 20px 0 6px;">
    <button type="button" aria-label="Listen back" style="width: 48px; height: 48px; flex: none; border-radius: 24px; border: none; background: #2A1E12; display: flex; align-items: center; justify-content: center;">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="#F6EFE4"></path></svg>
    </button>
    <svg aria-hidden="true" width="400" height="30" viewBox="0 0 400 30" style="flex: 1 1 auto;"><path d="{{mini}}" fill="none" stroke="#2A1E12" stroke-width="1.5"></path></svg>
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 800; font-size: 19px;">0:42</span>
  </div>

  <h1 style="position: absolute; left: 58px; top: 136px; margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 150px; line-height: 0.84; white-space: nowrap;">WHAT NOW?</h1>

  <button type="button" style="position: absolute; left: 64px; width: 560px; top: 290px; height: 108px; box-sizing: border-box; padding: 18px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 2px solid #2A1E12; border-radius: 4px; background: #F6EFE4; color: #2A1E12; font-family: 'Source Serif 4', Georgia, serif;">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 32px;">LET IT GO</span>
    <span style="font-size: 16px; line-height: 1.35;">Keep it to yourself. Nothing is uploaded or saved. Saying it was the point.</span>
  </button>

  <button type="button" aria-pressed="true" style="position: absolute; left: 64px; width: 560px; top: 410px; height: 108px; box-sizing: border-box; padding: 18px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; border: 2px solid #2A1E12; border-radius: 4px; background: #2A1E12; color: #F6EFE4; font-family: 'Source Serif 4', Georgia, serif;">
    <span style="font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 32px;">SHARE IT</span>
    <span style="font-size: 16px; line-height: 1.35;">Put it on the line for a stranger to hear, without your name.</span>
  </button>

  <svg aria-hidden="true" width="1440" height="60" viewBox="0 0 1440 60" style="position: absolute; left: 0; top: 510px;">
    <path d="M0 30 H630 C642 30 648 10 660 10 C674 10 674 30 658 34 C646 37 646 26 662 26 C674 26 680 30 692 30 H1440" fill="none" stroke="#2A1E12" stroke-width="2" stroke-linejoin="round"></path>
  </svg>
  <span style="position: absolute; left: 600px; top: 576px; font-family: 'Caveat Brush', cursive; font-size: 22px; color: #5A3814;">tie it on</span>

  <p style="position: absolute; left: 64px; width: 500px; top: 640px; margin: 0; font-family: 'Caveat Brush', cursive; font-size: 34px; line-height: 1.1; color: #5A3814; transform: rotate(-1.5deg); transform-origin: left center;">a person reviews every note before it's shared.</p>

  <section aria-labelledby="consent" style="position: absolute; left: 747px; width: 656px; top: 48px; bottom: 48px; box-sizing: border-box; padding: 36px 40px; border: 2px solid #2A1E12; border-radius: 4px; background: #FBF7F0; display: flex; flex-direction: column; gap: 16px">
    <h2 id="consent" style="margin: 0; font-size: 26px; font-weight: 600;">Before it goes on the line</h2>

    <label style="display: flex; gap: 14px; align-items: flex-start; font-size: 16.5px; line-height: 1.45;">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: #2A1E12;">
      <span>Store and process my note. It may say things about my health or my life.</span>
    </label>
    <label style="display: flex; gap: 14px; align-items: flex-start; font-size: 16.5px; line-height: 1.45;">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: #2A1E12;">
      <span>Share it without my name on social posts, the newsletter and <a href="DLibrary.dc.html">The Line library</a>, a page where anyone can listen to strangers' notes, sorted by theme. It stays there until I delete it with my private link.</span>
    </label>
    <label style="display: flex; gap: 14px; align-items: flex-start; font-size: 16.5px; line-height: 1.45;">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 2px 0 0; flex: none; accent-color: #2A1E12;">
      <span>Let Strnger edit, translate and re-voice it.</span>
    </label>

    <fieldset style="margin: 8px 0 0; padding: 0; border: none;">
      <legend style="padding: 0; margin-bottom: 10px; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 22px; letter-spacing: 0.04em;">WHOSE VOICE?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1.5px solid #2A1E12; border-radius: 4px; font-size: 15.5px; line-height: 1.4;">
          <input type="radio" name="voice" style="width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: #2A1E12;">
          <span><strong>My own voice.</strong> People who know you may recognise it. Once shared, others could record it.</span>
        </label>
        <label style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: 1.5px solid #2A1E12; border-radius: 4px; font-size: 15.5px; line-height: 1.4;">
          <input type="radio" name="voice" style="width: 20px; height: 20px; margin: 2px 0 0; flex: none; accent-color: #2A1E12;">
          <span><strong>A narrator's voice.</strong> Your words, read by someone else.</span>
        </label>
      </div>
    </fieldset>

    <fieldset style="margin: 8px 0 0; padding: 0; border: none;">
      <legend style="padding: 0; margin-bottom: 10px; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 22px; letter-spacing: 0.04em;">WHEN?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <label style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid #2A1E12; border-radius: 4px; font-size: 15.5px;">
          <input type="radio" name="when" style="width: 20px; height: 20px; margin: 0; flex: none; accent-color: #2A1E12;">
          <span>Once it's reviewed</span>
        </label>
        <label style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border: 1.5px solid #2A1E12; border-radius: 4px; font-size: 15.5px;">
          <input type="radio" name="when" style="width: 20px; height: 20px; margin: 0; flex: none; accent-color: #2A1E12;">
          <span>Give me 3 days to think</span>
        </label>
      </div>
    </fieldset>

    <a href="DTicket.dc.html" style="margin-top: auto; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: #2A1E12; color: #F6EFE4; text-decoration: none; font-family: 'Archivo', sans-serif; font-stretch: 62%; font-weight: 900; font-size: 28px; letter-spacing: 0.06em;">PUT IT ON THE LINE</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var pts = [];
    for (var x = 0; x <= 400; x += 3) {
      var i = x / 3;
      var env = 0.3 + 0.7 * Math.abs(Math.sin(i * 0.08 + 0.4));
      var y = 15 + 12 * env * (Math.sin(i * 1.6) * 0.6 + Math.sin(i * 0.47 + 1) * 0.4);
      pts.push((x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(1));
    }
    return { mini: pts.join(' ') };
  }
}
</script>
</body>
</html>
